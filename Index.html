
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoonThrift.in</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}
header{background:#172d27;color:white;padding:20px;text-align:center}
header h1{margin:0}
nav{background:#fff;padding:14px;text-align:center}
nav a{margin:10px;color:#172d27;text-decoration:none}
main{padding:18px;max-width:1100px;margin:auto}
input,button,textarea{padding:12px;margin:6px 0;width:100%;border:1px solid #ccc;border-radius:7px}
button{background:#172d27;color:white;border:0;cursor:pointer}
.card{background:white;padding:12px;border-radius:10px;margin:10px 0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.product img{width:100%;height:210px;object-fit:cover;border-radius:8px}
.price{font-weight:bold;color:#176b45}
section{margin-bottom:30px}
</style>
</head>
<body>

<header>
<h1>DOONTHRIFT</h1>
<p>Find Unique Clothes. Shop Smart.</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#upload">Sell Clothes</a>
<a href="#orders">Orders</a>
</nav>

<main>
<section id="home">
<h2>Find Your Style</h2>
<input id="search" placeholder="Search clothes..." oninput="showProducts()">
</section>

<section id="upload" class="card">
<h2>Upload Product</h2>
<input id="pname" placeholder="Product name">
<input id="price" type="number" placeholder="Price ₹">
<input id="supplier" placeholder="Supplier name">
<textarea id="description" placeholder="Product description"></textarea>
<label>Upload clear product photo</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">Upload Product</button>
</section>

<section id="products">
<h2>Latest Products</h2>
<div class="products" id="productList"></div>
</section>

<section id="orders" class="card">
<h2>Place Your Order</h2>
<input id="customer" placeholder="Full name">
<input id="phone" type="tel" placeholder="Mobile number">
<input id="email" type="email" placeholder="Email address">
<input id="address" placeholder="Delivery address">
<input id="porder" placeholder="Product name">
<button onclick="placeOrder()">Place Order</button>
<p id="orderMessage"></p>
</section>

<section class="card">
<h2>Track Your Order</h2>
<input id="tracking" placeholder="Enter Tracking ID">
<button onclick="trackOrder()">Track Order</button>
<p id="trackMessage"></p>
</section>

<footer>
<p>© 2026 DoonThrift.in</p>
<p>Unique Thrift Fashion Marketplace</p>
</footer>
</main>

<script>
let products=JSON.parse(localStorage.getItem("doonProducts")||"[]");

function save(){
localStorage.setItem("doonProducts",JSON.stringify(products));
}

function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
let list=document.getElementById("productList");
list.innerHTML="";
products.filter(p=>p.name.toLowerCase().includes(q))
.forEach((p,i)=>{
list.innerHTML+=`
<div class="card product">
<img src="${p.photo}">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<p>Supplier: ${p.supplier}</p>
<p>${p.description}</p>
<button onclick="orderProduct('${p.name.replace(/'/g,"")}')">Order Now</button>
<button onclick="deleteProduct(${i})">Remove Product</button>
</div>`;
});
}

function addProduct(){
let name=pname.value.trim();
let price=Number(document.getElementById("price").value);
let supplier=document.getElementById("supplier").value.trim();
let description=document.getElementById("description").value;
let file=document.getElementById("photo").files[0];

if(!name||!price||!supplier||!file){
alert("Please fill all required fields and upload a photo.");
return;
}
if(!file.type.startsWith("image/")){
alert("Please upload an image.");
return;
}
let reader=new FileReader();
reader.onload=()=>{
products.push({name,price,supplier,description,photo:reader.result});
save();
showProducts();
alert("Product uploaded!");
};
reader.readAsDataURL(file);
}

function deleteProduct(i){
if(confirm("Remove this product?")){
products.splice(i,1);
save();
showProducts();
}
}

function orderProduct(name){
document.getElementById("porder").value=name;
document.getElementById("orders").scrollIntoView();
}

function placeOrder(){
let name=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let email=document.getElementById("email").value.trim();
let address=document.getElementById("address").value.trim();
let product=document.getElementById("porder").value.trim();

if(!name||!phone||!email||!address||!product){
alert("Please fill all order details.");
return;
}
document.getElementById("orderMessage").innerText=
"Demo order received. Real order confirmation will be enabled after backend setup.";
}

function trackOrder(){
document.getElementById("trackMessage").innerText=
"Tracking will be available after courier integration.";
}

showProducts();
</script>
</body>
</html>
